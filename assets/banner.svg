<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Worlds, made executable</title>
  <desc id="banner-desc">An original cover for Code-Centric World Models, pairing a small world program with a geometric world.</desc>
  <defs>
    <pattern id="banner-grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dbe5e3" stroke-width="1"/></pattern>
    <clipPath id="banner-world-clip"><circle cx="1090" cy="206" r="112"/></clipPath>
  </defs>
  <rect x="1" y="1" width="1278" height="398" rx="12" fill="#f6f8f7" stroke="#dce5e1" stroke-width="2"/>
  <rect x="640" y="1" width="638" height="398" rx="12" fill="url(#banner-grid)"/>
  <path d="M640 1V399" stroke="#dce5e1"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="48" width="8" height="8" fill="#0f766e"/>
    <text x="72" y="57" fill="#52655f" font-size="13" font-weight="700" letter-spacing="2.1">PROGRAMS AS WORLD MODELS</text>
    <text x="52" y="144" fill="#172f2a" font-size="58" font-weight="700" letter-spacing="-2">Worlds, made</text>
    <text x="52" y="212" fill="#0f766e" font-size="58" font-weight="700" letter-spacing="-2">executable.</text>
    <text x="56" y="265" fill="#52655f" font-size="20">Learn the rules. Keep the state.</text>
    <text x="56" y="294" fill="#52655f" font-size="20">Render what follows.</text>
    <path d="M56 333H590" stroke="#d3dfd9"/>
    <text x="56" y="363" fill="#52655f" font-size="12" font-weight="700" letter-spacing="2">CODE</text>
    <text x="116" y="363" fill="#a2b4ac" font-size="12">/</text>
    <text x="140" y="363" fill="#52655f" font-size="12" font-weight="700" letter-spacing="2">STATE</text>
    <text x="212" y="363" fill="#a2b4ac" font-size="12">/</text>
    <text x="236" y="363" fill="#52655f" font-size="12" font-weight="700" letter-spacing="2">OBSERVATION</text>
  </g>
  <path d="M928 206H978m-10-5 10 5-10 5" fill="none" stroke="#6b9285" stroke-width="2"/>
  <rect x="680" y="116" width="248" height="180" rx="8" fill="#172f2a"/>
  <path d="M680 152H928" stroke="#365049"/>
  <circle cx="698" cy="134" r="4" fill="#76958a"/><circle cx="713" cy="134" r="4" fill="#76958a"/><circle cx="728" cy="134" r="4" fill="#76958a"/>
  <text x="909" y="139" text-anchor="end" font-family="monospace" font-size="11" fill="#a5c0b5">world.py</text>
  <g font-family="monospace" font-size="15">
    <text x="700" y="185" fill="#b9ded0"><tspan fill="#75cab3">def</tspan> step(s, a):</text>
    <text x="700" y="218" fill="#b9ded0">  s = update(s, a)</text>
    <text x="700" y="251" fill="#b9ded0">  <tspan fill="#75cab3">return</tspan> s</text>
  </g>
  <circle cx="1090" cy="206" r="112" fill="#edf4ef" stroke="#6b9285" stroke-width="1.5"/>
  <g clip-path="url(#banner-world-clip)" fill="none" stroke="#b4cbbf" stroke-width="1">
    <ellipse cx="1090" cy="206" rx="112" ry="38"/><ellipse cx="1090" cy="206" rx="112" ry="80"/>
    <ellipse cx="1090" cy="206" rx="38" ry="112"/><ellipse cx="1090" cy="206" rx="80" ry="112"/>
    <path d="M978 206H1202M1090 94V318"/>
  </g>
  <g stroke="#0f766e" stroke-width="1.6" stroke-linejoin="round">
    <path d="m1027 214 42-24 42 24-42 24Z" fill="#c3dfd0"/><path d="m1027 214 42 24v42l-42-24Z" fill="#79b49d"/><path d="m1069 238 42-24v42l-42 24Z" fill="#a6cebb"/>
    <path d="m1081 159 36-21 36 21-36 21Z" fill="#e7f2e9"/><path d="m1081 159 36 21v62l-36-21Z" fill="#79b49d"/><path d="m1117 180 36-21v62l-36 21Z" fill="#c3dfd0"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#52655f">
    <text x="680" y="337">EXECUTABLE PROGRAM</text><text x="1090" y="337" text-anchor="middle">PERSISTENT WORLD</text>
  </g>
</svg>
